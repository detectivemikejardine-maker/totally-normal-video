<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long Shot: daily trivia</title>
<meta property="og:title" content="Long Shot 🎯">
<meta property="og:description" content="10 questions. 10 seconds each. Build a combo. Keep your streak alive.">
<style>
  :root {
    --bg: #0e1726; --panel: #16223a; --line: #263556; --text: #eef2fb; --muted: #93a1bf;
    --gold: #ffc94a; --good: #3ddc97; --bad: #ff5c7a; --purple: #b18cff; --fire: #ff8a3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #1b2a4a, var(--bg) 60%) fixed; color: var(--text);
    min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px; overflow-x: hidden;
  }
  .app { width: 100%; max-width: 560px; min-width: 0; position: relative; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .logo { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
  .logo span { color: var(--gold); }
  .logo, footer { text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .chips { display: flex; gap: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .hidden { display: none !important; }
  h2 { font-size: 22px; line-height: 1.3; }
  .muted { color: var(--muted); }
  button {
    font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 15px 20px; cursor: pointer;
    background: var(--gold); color: #1a1300; width: 100%; font-size: 17px; transition: transform .08s;
  }
  button:active { transform: scale(.97); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .stack { display: grid; gap: 10px; }

  /* level bar */
  .lvl { margin: 16px 0 20px; }
  .lvl-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .xpbar { height: 10px; background: #0f1a2e; border-radius: 5px; overflow: hidden; }
  .xpbar div { height: 100%; background: linear-gradient(90deg, var(--purple), var(--gold)); width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; text-align: center; }
  .stat { background: #0f1a2e; border-radius: 12px; padding: 10px 4px; }
  .stat b { display: block; font-size: 22px; }
  .stat small { color: var(--muted); font-size: 12px; }

  /* game */
  .gtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .dots i.ok { background: var(--good); } .dots i.no { background: var(--bad); } .dots i.now { background: var(--gold); }
  .combo { font-weight: 900; color: var(--fire); min-width: 70px; text-align: right; transition: transform .15s; }
  .combo.pop { transform: scale(1.4); }
  .timer { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .timer div { height: 100%; background: var(--good); width: 100%; }
  .golden { display: inline-block; background: var(--gold); color: #1a1300; font-weight: 900; font-size: 12px; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 18px var(--gold); } }
  .diff { font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .opts { display: grid; gap: 10px; margin-top: 18px; }
  .opt {
    background: #0f1a2e; color: var(--text); border: 2px solid var(--line); text-align: left;
    font-weight: 700; display: flex; gap: 12px; align-items: center;
  }
  .opt kbd { font: inherit; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .opt:hover:not(:disabled) { border-color: var(--gold); }
  .opt.right { background: #12442f; border-color: var(--good); }
  .opt.wrong { background: #4a1724; border-color: var(--bad); }
  .opt:disabled { cursor: default; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }

  .floater { position: fixed; font-weight: 900; font-size: 26px; pointer-events: none; color: var(--gold);
    text-shadow: 0 2px 8px #000; animation: floatUp .9s ease-out forwards; z-index: 10; }
  @keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(1); } to { opacity: 0; transform: translate(-50%, -70px) scale(1.3); } }

  /* end */
  .big { font-size: 60px; font-weight: 900; color: var(--gold); text-align: center; line-height: 1.1; }
  .newbest { text-align: center; color: var(--purple); font-weight: 900; letter-spacing: 1px; animation: glow2 .6s ease-in-out infinite alternate; }
  @keyframes glow2 { to { transform: scale(1.08); } }
  .grid { font-size: 26px; text-align: center; letter-spacing: 3px; margin: 10px 0 4px; }
  .center { text-align: center; }
  .countdown { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 20px; }
  .badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .badge { overflow-wrap: anywhere; background: #0f1a2e; border-radius: 12px; padding: 10px 4px; text-align: center; font-size: 11px; color: var(--muted); }
  .badge .e { font-size: 26px; display: block; filter: grayscale(1) opacity(.35); }
  .badge.got { color: var(--text); } .badge.got .e { filter: none; }
  .toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: var(--purple); color: #120a24;
    font-weight: 800; padding: 12px 18px; border-radius: 12px; z-index: 20; animation: toast 3s forwards; white-space: nowrap; }
  @keyframes toast { 0% { transform: translate(-50%, -80px); } 10%, 85% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -80px); } }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  footer a { color: var(--muted); }
  section + section { margin-top: 14px; }

  /* ---------- dimensions ---------- */
  body { background: var(--bg); }
  #world { position: fixed; inset: 0; z-index: -1; background: var(--world, radial-gradient(ellipse at top, #1b2a4a, #0e1726 60%)); transition: background 0s; overflow: hidden; }
  #world span { position: absolute; font-size: 34px; opacity: .22; animation: drift linear infinite; }
  @keyframes drift { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-20vh) rotate(360deg); } }
  .panel { background: rgba(22, 34, 58, .9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .dimhud { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .dimname { font-weight: 800; font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ladder { display: flex; gap: 3px; }
  .ladder i { width: 7px; height: 16px; border-radius: 2px; background: #0f1a2e; }
  .ladder i.on { background: var(--muted); } .ladder i.me { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .dimflavor { font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
  .portal {
    position: fixed; z-index: 30; width: 140vmax; height: 140vmax; border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%) scale(0); transition: transform .6s cubic-bezier(.5, 0, .2, 1);
  }
  .portal::before, .portal::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
  .portal::before { background: var(--swirl); animation: spin .8s linear infinite; }
  .portal::after { background: radial-gradient(circle, transparent 35%, rgba(0,0,0,.35) 60%, transparent 72%); }
  .portal.up { --swirl: conic-gradient(#b8ff3d, #1fe0a8, #0e7d4f, #c6ff7a, #2cf5c0, #0e7d4f, #b8ff3d); filter: drop-shadow(0 0 40px #7dff6a); }
  .portal.down { --swirl: conic-gradient(#ff4d4d, #6b1a1a, #ff8a3d, #3a0d0d, #ff4d4d, #6b1a1a, #ff4d4d); filter: drop-shadow(0 0 40px #ff3d3d); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .arrival { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 31; text-align: center; pointer-events: none;
    font-weight: 900; font-size: clamp(22px, 6vw, 34px); text-shadow: 0 3px 12px #000; animation: arrive 1.1s ease-out forwards; width: 90%; }
  .arrival small { display: block; font-size: 14px; font-weight: 700; opacity: .85; letter-spacing: 2px; }
  @keyframes arrive { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 25%, 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1.05); } }
</style>
</head>

  <section class="panel hidden" id="end">
    <p class="center muted" id="endTitle">Daily complete</p>
    <div class="big" id="finalScore">0</div>
    <div id="newBest"></div>
    <p class="center" id="dimEnd" style="font-weight:800;margin-top:6px"></p>
    <div class="grid" id="emojiGrid"></div>
    <p class="center muted" id="endLine" style="margin-bottom:14px"></p>
    <div class="lvl">
      <div class="lvl-top"><b id="eLvlName">Level 1</b><span class="muted" id="eXpGain">+0 XP</span></div>
      <div class="xpbar"><div id="eXpFill"></div></div>
    </div>
    <div class="stack" id="endBtns"></div>
    <p class="center muted" style="margin-top:16px" id="nextLine">Next daily in <span class="countdown" id="countdown">--:--:--</span></p>
  </section>

  <footer><a href="prank/">psst… there's also a totally normal video</a></footer>
</div>

];

// ============ DIMENSIONS: worst (0) -> best (10) ============
// [emoji, name, flavor, background]
const DIMS = [
  ["🪣","The Damp Dimension","Everything is slightly wet. Forever.","linear-gradient(#2b3328,#151a14)"],
  ["🧦","Single Sock Reality","Every sock you own is a left sock.","linear-gradient(#3a3226,#1c1812)"],
  ["🟫","Beige World","Color was outlawed in 1987.","linear-gradient(#5c5140,#2e281f)"],
  ["📎","Eternal Monday","It is always 8:59 a.m. on a Monday.","linear-gradient(#3d4352,#1d2029)"],
  ["🪑","The Waiting Room","Now serving number 4. You are 4,000,112.","linear-gradient(#2f3d4a,#161e25)"],
  ["🌍","Prime Reality","Pretty normal. This is where you started.","radial-gradient(ellipse at top,#1b2a4a,#0e1726 60%)"],
  ["🍕","Pizza Weather","Light pizza showers this afternoon.","radial-gradient(ellipse at top,#7a3410,#2a1206 70%)"],
  ["🐕","Dogs With Jobs","Your dentist is a very good boy.","radial-gradient(ellipse at top,#1f6b5a,#0b2a24 70%)"],
  ["🛹","Neon Skate Realm","Gravity is optional on weekends.","radial-gradient(ellipse at top,#c41d8f,#26104a 70%)"],
  ["🎂","Cake Galaxy","Every planet is a different flavor.","radial-gradient(ellipse at top,#ff7eb6,#5a1d6e 70%)"],
  ["👾","The Infinite Arcade","Everything is free and you're the high score.","conic-gradient(from 0deg at 50% 0%,#2cf5c0,#7a2dff,#ff2d95,#ffe02d,#2cf5c0)"],
];
const START_DIM = 5;
function paintWorld(i) {
  const [e, , , bg] = DIMS[i], w = $("world");
  w.style.setProperty("--world", bg);
  w.innerHTML = Array.from({ length: 12 }, (_, k) =>
    `<span style="left:${(k * 83) % 100}%;animation-duration:${14 + (k * 7) % 12}s;animation-delay:-${(k * 3.7) % 14}s">${e}</span>`).join("");
}
function setDim(i) {
  G.dim = i; G.seen.add(i); G.bestDim = Math.max(G.bestDim, i); G.lowDim = Math.min(G.lowDim, i);
  const [e, n, f] = DIMS[i];
  $("dimName").textContent = `${e} ${n}`; $("dimFlavor").textContent = f;
  $("ladder").innerHTML = DIMS.map((_, k) => `<i class="${k === i ? "me" : k < i ? "on" : ""}"></i>`).join("");
  paintWorld(i);
  if (i === DIMS.length - 1) award("top");
  if (i === 0) award("bottom");
  if (G.seen.size >= 8) award("tourist");
}

// portal travel animation: grows from the answer, swaps dimension, shrinks away
function travel(delta, from, then) {
  const target = Math.max(0, Math.min(DIMS.length - 1, G.dim + delta));
  const r = (from || $("qText")).getBoundingClientRect();
  const p = document.createElement("div");
  p.className = "portal " + (delta > 0 ? "up" : "down");
  p.style.left = (r.left + r.width / 2) + "px"; p.style.top = (r.top + r.height / 2) + "px";
  document.body.appendChild(p);
  sfx.whoosh(delta > 0);
  requestAnimationFrame(() => requestAnimationFrame(() => p.style.transform = "translate(-50%, -50%) scale(1)"));
  setTimeout(() => {
    const moved = target !== G.dim;
    setDim(target); then();
    const [e, n] = DIMS[target], a = document.createElement("div");
    a.className = "arrival";
    a.innerHTML = `<small>${!moved ? (delta > 0 ? "ALREADY AT THE TOP" : "CAN'T GO ANY LOWER") : delta > 0 ? "▲ UPGRADED TO" : "▼ DOWNGRADED TO"}</small>${e} ${n}`;
    document.body.appendChild(a); setTimeout(() => a.remove(), 1100);
    p.style.left = "50%"; p.style.top = "50%"; p.style.transition = "transform .5s cubic-bezier(.6,0,.8,.4)";
    p.style.transform = "translate(-50%, -50%) scale(0)";
    setTimeout(() => p.remove(), 550);
  }, 650);
}

// ============ Sound ============
let ac;
function tone(freq, dur = .12, type = "triangle", vol = .15, when = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  } catch {}
}
const sfx = {
  right: c => { const b = 523 * Math.pow(2, Math.min(c, 12) / 12); tone(b); tone(b * 1.5, .15, "triangle", .12, .07); },
  wrong: () => { tone(160, .25, "sawtooth", .12); tone(120, .3, "sawtooth", .1, .1); },
  tick: () => tone(900, .04, "square", .05),
  whoosh: up => { try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime, len = ac.sampleRate * 1.1, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = "bandpass"; f.Q.value = 6;
    f.frequency.setValueAtTime(up ? 300 : 2400, t); f.frequency.exponentialRampToValueAtTime(up ? 3000 : 180, t + 1);
    g.gain.setValueAtTime(.001, t); g.gain.exponentialRampToValueAtTime(.5, t + .3); g.gain.exponentialRampToValueAtTime(.001, t + 1.05);
    s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + 1.1);
  } catch {} },
  fanfare: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, "triangle", .15, i * .1)),
};

// ============ Confetti ============
const cv = $("fx"), cx = cv.getContext("2d"); let bits = [], raf;
function confetti(n = 120, y = -20) {
  cv.width = innerWidth; cv.height = innerHeight;
  for (let i = 0; i < n; i++) bits.push({ x: Math.random() * cv.width, y: y - Math.random() * 200, vx: (Math.random() - .5) * 4,
    vy: 2 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: `hsl(${Math.random() * 360},90%,60%)` });
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits = bits.filter(b => b.y < cv.height + 20);
  bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.r += b.vr; cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-4, -6, 8, 12); cx.restore(); });
  raf = bits.length ? requestAnimationFrame(loop) : null;
}
function floater(text, el, color) {
  const r = el.getBoundingClientRect(), f = document.createElement("div");
  f.className = "floater"; f.textContent = text; if (color) f.style.color = color;
  f.style.left = (r.left + r.width / 2) + "px"; f.style.top = (r.top) + "px";
  document.body.appendChild(f); setTimeout(() => f.remove(), 900);
}
function toast(text) { const t = document.createElement("div"); t.className = "toast"; t.textContent = text; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

// ============ Progress / meta ============
const P = {
  xp: store.get("xp", 0), streak: store.get("streak", 0), lastDay: store.get("lastDay", 0),
  best: store.get("best", 0), endless: store.get("endless", 0), badges: store.get("badges", {}),
  daily: store.get("daily", null), // {day, score, grid}
};
// streak breaks if you skipped a day
if (P.lastDay && today() - P.lastDay > 1) { P.streak = 0; store.set("streak", 0); }
function award(id) {
  if (P.badges[id]) return;
  P.badges[id] = true; store.set("badges", P.badges);
  const b = BADGES.find(b => b[0] === id); toast(`${b[1]} Badge unlocked: ${b[2]}`); sfx.fanfare();
}

function renderHome() {
  const d = today(), li = levelInfo(P.xp);
  $("homeTitle").textContent = `Daily #${d}`;
  $("streakChip").textContent = `🔥 ${P.streak}`; $("lvlChip").textContent = `Lv ${li.l}`;
  $("lvlName").textContent = `Level ${li.l} · ${title(li.l)}`; $("lvlXp").textContent = `${li.into} / ${li.need} XP`;
  requestAnimationFrame(() => $("xpFill").style.width = (li.into / li.need * 100) + "%");
  $("sStreak").textContent = P.streak; $("sBest").textContent = P.best; $("sEndless").textContent = P.endless;
  const played = P.daily && P.daily.day === d;
  $("homeBtns").innerHTML = played
    ? `<p class="center muted">Today's done: <b style="color:var(--gold)">${P.daily.score}</b> ${P.daily.grid}</p>
       <button id="hEndless">♾️ Play Endless while you wait</button>`
    : `<button id="hDaily">▶ Play Daily #${d}</button><button class="ghost" id="hEndless">♾️ Endless mode</button>`;
  if (!played) {
    $("hDaily").onclick = () => start("daily");
    if (P.streak > 0) $("hDaily").textContent = `▶ Play Daily #${d} · keep your 🔥${P.streak} alive`;
  }
  $("hEndless").onclick = () => start("endless");
  $("badges").innerHTML = BADGES.map(([id, e, n]) => `<div class="badge ${P.badges[id] ? "got" : ""}"><span class="e">${e}</span>${n}</div>`).join("");
  $("badgeCount").textContent = `${Object.keys(P.badges).length}/${BADGES.length}`;
  show("home");
}
function show(id) { ["home", "game", "end"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }

// ============ Game ============
const TIME = 10, MULTS = [1, 1, 1.5, 1.5, 2, 2, 2.5, 2.5, 3];
let G;

function start(mode) {
  let qs;
  if (mode === "daily") {
    const r = rng(today() * 7919);
    qs = [...shuffle(Q[1], r).slice(0, 4), ...shuffle(Q[2], r).slice(0, 3), ...shuffle(Q[3], r).slice(0, 3)]
      .map((q, i) => ({ q, d: i < 4 ? 1 : i < 7 ? 2 : 3, opts: shuffle(q.slice(1), r) }));
    const gi = 3 + Math.floor(r() * 6); qs[gi].golden = true;
  } else {
    qs = []; // filled as you go
  }
  G = { mode, qs, i: 0, score: 0, combo: 0, maxCombo: 0, lives: 3, grid: [], correct: 0, used: new Set(),
        seen: new Set(), bestDim: START_DIM, lowDim: START_DIM, climb: 0 };
  setDim(START_DIM);
  show("game"); next();
}

function endlessQ() {
  const d = G.i < 5 ? 1 : G.i < 12 ? 2 : 3;
  let pool = Q[d].filter(q => !G.used.has(q[0]));
  if (!pool.length) pool = Q[d];
  const q = pool[Math.floor(Math.random() * pool.length)]; G.used.add(q[0]);
  return { q, d, opts: shuffle(q.slice(1)), golden: Math.random() < .12 };
}

function next() {
  const daily = G.mode === "daily";
  if (!daily) G.qs[G.i] = endlessQ();
  const cur = G.qs[G.i];
  // header
  $("dots").innerHTML = daily
    ? G.qs.map((_, k) => `<i class="${k < G.i ? (G.grid[k] === "🟥" ? "no" : "ok") : k === G.i ? "now" : ""}"></i>`).join("")
    : "❤️".repeat(G.lives) + "🖤".repeat(3 - G.lives) + ` <span class="muted">#${G.i + 1}</span>`;
  $("liveScore").textContent = G.score;
  setCombo();
  $("goldenTag").innerHTML = cur.golden ? `<span class="golden">🌟 GOLDEN QUESTION · DOUBLE POINTS</span>` : "";
  $("diff").textContent = ["", "Easy", "Medium", "Hard"][cur.d];
  $("qText").textContent = cur.q[0];
  $("opts").innerHTML = cur.opts.map((o, k) => `<button class="opt" data-o="${encodeURIComponent(o)}"><kbd>${k + 1}</kbd>${o}</button>`).join("");
  [...$("opts").children].forEach(b => b.onclick = () => pick(b));
  // timer
  G.t0 = performance.now(); G.locked = false; G.lastTick = TIME;
  cancelAnimationFrame(G.raf);
  const step = now => {
    const left = Math.max(0, TIME - (now - G.t0) / 1000);
    const bar = $("timerBar"); bar.style.width = (left / TIME * 100) + "%";
    bar.style.background = left < 3 ? "var(--bad)" : left < 6 ? "var(--gold)" : "var(--good)";
    if (left < 3 && Math.ceil(left) < G.lastTick) { G.lastTick = Math.ceil(left); sfx.tick(); }
    if (left === 0) return pick(null);
    if (!G.locked) G.raf = requestAnimationFrame(step);
  };
  G.raf = requestAnimationFrame(step);
}

function setCombo(pop) {
  const c = $("combo");
  c.textContent = G.combo >= 2 ? `🔥${G.combo} ×${MULTS[Math.min(G.combo, MULTS.length - 1)]}` : "";
  if (pop) { c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); setTimeout(() => c.classList.remove("pop"), 150); }
}

function pick(btn) {
  if (G.locked) return; G.locked = true; cancelAnimationFrame(G.raf);
  const cur = G.qs[G.i], secs = (performance.now() - G.t0) / 1000;
  const answer = btn && decodeURIComponent(btn.dataset.o), ok = answer === cur.q[1];
  [...$("opts").children].forEach(b => { b.disabled = true; if (decodeURIComponent(b.dataset.o) === cur.q[1]) b.classList.add("right"); });

  if (ok) {
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.correct++;
    const mult = MULTS[Math.min(G.combo, MULTS.length - 1)] * (cur.golden ? 2 : 1);
    const speed = Math.round(Math.max(0, TIME - secs) / TIME * 100);
    const pts = Math.round((50 + speed) * mult);
    G.score += pts; sfx.right(G.combo);
    floater(`+${pts}`, btn, cur.golden ? "#ffe680" : null);
    if (secs < 1.5) award("speed");
    if (cur.golden) { award("golden"); confetti(60); }
    if (G.combo === 5) { award("combo5"); confetti(50); }
    if (G.combo === 10) award("combo10");
    G.grid.push(secs < 3 ? "⚡" : "🟩");
    setCombo(true);
  } else {
    if (btn) btn.classList.add("wrong");
    $("game").classList.remove("shake"); void $("game").offsetWidth; $("game").classList.add("shake");
    sfx.wrong();
    if (G.combo >= 3) floater(`combo lost 💔`, $("combo"), "#ff5c7a");
    G.combo = 0; G.grid.push("🟥"); G.lives--;
    setCombo();
  }
  $("liveScore").textContent = G.score;

  // climbing back up after falling below where you started
  G.climb = ok ? G.climb + 1 : 0;
  if (G.climb >= 4 && G.lowDim < START_DIM) award("comeback");

  setTimeout(() => {
    G.i++;
    const done = G.mode === "daily" ? G.i >= G.qs.length : G.lives <= 0;
    travel(ok ? (cur.golden ? 2 : 1) : -1, btn, () => done ? finish() : next());
  }, ok ? 450 : 1200);
}

function finish() {
  const daily = G.mode === "daily", d = today();
  const xpGain = Math.round(G.score / 10) + (daily ? 25 : 0);
  const before = levelInfo(P.xp);
  P.xp += xpGain; store.set("xp", P.xp);
  const after = levelInfo(P.xp);
  let newBest = false;

  award("first");
  if (daily) {
    if (P.lastDay !== d) { P.streak = (d - P.lastDay === 1) ? P.streak + 1 : 1; P.lastDay = d; store.set("streak", P.streak); store.set("lastDay", d); }
    if (G.score > P.best) { newBest = P.best > 0; P.best = G.score; store.set("best", P.best); }
    P.daily = { day: d, score: G.score, grid: G.grid.join("") }; store.set("daily", P.daily);
    if (G.correct === G.qs.length) { award("perfect"); confetti(200); }
    if (G.score >= 1000) award("k1");
    if (P.streak >= 3) award("streak3");
    if (P.streak >= 7) award("streak7");
  } else {
    if (G.correct > P.endless) { newBest = P.endless > 0; P.endless = G.correct; store.set("endless", P.endless); }
    if (G.correct >= 15) award("endless15");
  }
  if (after.l >= 5) award("lvl5");
  if (after.l >= 10) award("lvl10");

  show("end");
  $("streakChip").textContent = `🔥 ${P.streak}`; $("lvlChip").textContent = `Lv ${after.l}`;
  $("endTitle").textContent = daily ? `Daily #${d} complete` : `Endless · ${G.correct} correct`;
  // count-up score
  const fs = $("finalScore"), target = G.score, t0 = performance.now();
  setTimeout(() => fs.textContent = target, 1000);
  (function up() { const p = Math.min(1, Math.max(0, (performance.now() - t0) / 900)); fs.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(up); })(t0);
  $("newBest").innerHTML = newBest ? `<div class="newbest">★ NEW PERSONAL BEST ★</div>` : "";
  if (newBest) { confetti(150); sfx.fanfare(); }
  $("emojiGrid").textContent = G.grid.join("");
  const [de, dn] = DIMS[G.dim];
  $("dimEnd").innerHTML = `You ended up in ${de} ${dn}<br><span class="muted" style="font-weight:600;font-size:14px">Highest: ${DIMS[G.bestDim][0]} ${DIMS[G.bestDim][1]}</span>`;
  $("endLine").innerHTML = daily
    ? `${G.correct}/10 correct · best combo 🔥${G.maxCombo} · streak <b>🔥 ${P.streak} day${P.streak === 1 ? "" : "s"}</b>`
    : `Best combo 🔥${G.maxCombo} · your record: ${P.endless} correct`;

  // XP bar animation with level-up
  $("eXpGain").textContent = `+${xpGain} XP`;
  $("eLvlName").textContent = `Level ${before.l} · ${title(before.l)}`;
  const fill = $("eXpFill"); fill.style.transition = "none"; fill.style.width = (before.into / before.need * 100) + "%";
  setTimeout(() => {
    fill.style.transition = "";
    if (after.l > before.l) {
      fill.style.width = "100%";
      setTimeout(() => {
        $("eLvlName").textContent = `Level ${after.l} · ${title(after.l)}`;
        toast(`⬆️ LEVEL UP! Level ${after.l}: ${title(after.l)}`); sfx.fanfare(); confetti(80);
        fill.style.transition = "none"; fill.style.width = "0";
        setTimeout(() => { fill.style.transition = ""; fill.style.width = (after.into / after.need * 100) + "%"; }, 50);
      }, 1200);
    } else fill.style.width = (after.into / after.need * 100) + "%";
  }, 400);

  $("endBtns").innerHTML = `<button id="eShare">📤 Share</button>` +
    (daily ? `<button class="ghost" id="eEndless">♾️ Keep playing: Endless</button>` : `<button class="ghost" id="eEndless">↻ Play Endless again</button>`) +
    `<button class="ghost" id="eHome">Home</button>`;
  $("eEndless").onclick = () => start("endless");
  $("eHome").onclick = renderHome;
  $("eShare").onclick = async () => {
    const text = daily
      ? `Long Shot #${d} 🎯 ${G.score}\n${G.grid.join("")}\nEnded in ${de} ${dn}\n🔥${P.streak} day streak\n${location.href.split("#")[0]}`
      : `Long Shot Endless ♾️ ${G.correct} correct, ${G.score} pts. Ended in ${de} ${dn}. Beat me:\n${location.href.split("#")[0]}`;
    try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); $("eShare").textContent = "✅ Copied!"; } } catch {}
  };
  $("nextLine").classList.toggle("hidden", !daily);
}

// countdown to local midnight
setInterval(() => {
  const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0);
  const s = Math.floor((m - n) / 1000);
  $("countdown").textContent = [s / 3600, s % 3600 / 60, s % 60].map(x => String(Math.floor(x)).padStart(2, "0")).join(":");
}, 1000);

// keyboard 1-4
addEventListener("keydown", e => {
  if ($("game").classList.contains("hidden")) return;
  const b = $("opts").children[+e.key - 1]; if (b && !b.disabled) pick(b);
});

renderHome();
</script>
